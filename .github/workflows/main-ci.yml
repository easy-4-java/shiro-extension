name: Main source verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout pinned JWT issuer source
        uses: actions/checkout@v7
        with:
          repository: easy-4-java/jwt-issuer
          ref: 6b1a4de65a12a155e98e957ea82e446ef6420b36
          path: .ci-dependencies/jwt-issuer
      - name: Verify and install JWT issuer
        run: mvn -B -ntp -s .github/maven-central-settings.xml -Dmaven.repo.local="${RUNNER_TEMP}/verified-m2" -f .ci-dependencies/jwt-issuer/pom.xml clean install
      - name: Verify Shiro extension
        run: mvn -B -ntp -s .github/maven-central-settings.xml -Dmaven.repo.local="${RUNNER_TEMP}/verified-m2" clean verify
      - name: Require coverage for modules with existing tests
        run: |
          test -s .ci-dependencies/jwt-issuer/jwt-issuer-with-jjwt/target/jacoco.exec
          test -s .ci-dependencies/jwt-issuer/jwt-issuer-with-jjwt/target/site/jacoco/jacoco.xml
          test -s shiro-extension-core/target/jacoco.exec
          test -s shiro-extension-core/target/site/jacoco/jacoco.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-verification-reports
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            .ci-dependencies/**/target/surefire-reports/**
            .ci-dependencies/**/target/site/jacoco/**
