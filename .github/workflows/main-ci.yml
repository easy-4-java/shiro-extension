name: Main source verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout pinned JWT issuer source
        uses: actions/checkout@v7
        with:
          repository: easy-4-java/jwt-issuer
          ref: fe29ffd8471eff70d2117b73e4cb2459e5ec4a2f
          path: .ci-dependencies/jwt-issuer
      - name: Verify and install JWT issuer
        run: mvn -B -ntp -s .github/maven-central-settings.xml -Dmaven.repo.local="${RUNNER_TEMP}/verified-m2" -f .ci-dependencies/jwt-issuer/pom.xml clean install
      - name: Verify Shiro extension
        run: mvn -B -ntp -s .github/maven-central-settings.xml -Dmaven.repo.local="${RUNNER_TEMP}/verified-m2" clean verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-verification-reports
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            .ci-dependencies/**/target/surefire-reports/**
